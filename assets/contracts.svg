<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Active contracts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#d11" stop-opacity="0"/><stop offset=".5" stop-color="#ff5a3c"/><stop offset="1" stop-color="#d11" stop-opacity="0"/></linearGradient>
<style>
.c1{font-family:'Courier New',monospace;font-weight:700;font-size:13px;letter-spacing:4px;fill:#d11}
.c2{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:18px;fill:#f2f2f2}
.c3{font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;fill:#d4af37}
.dot{fill:#e11;animation:bl 1.4s ease-in-out infinite}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.sh{animation:mv 2.4s linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(340px)}}
</style></defs>
<g transform="translate(0 0)"><clipPath id="k0"><rect x="24" y="156" width="232" height="8" rx="4"/></clipPath>
<rect x="1" y="1" width="278" height="218" rx="10" fill="#0b0b0c" stroke="#d4af37" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="1" y="1" width="278" height="6" rx="3" fill="#d11"/>
<text class="c1" x="24" y="40">CONTRACT I</text>
<text class="c2" x="24" y="84">Build autonomous AI agents</text><text class="c2" x="24" y="110">with Python</text>
<circle class="dot" cx="30" cy="136" r="5" style="animation-delay:-0.0s"/><text class="c3" x="44" y="141">IN PROGRESS</text>
<rect x="24" y="156" width="232" height="8" rx="4" fill="#1b1b1d"/>
<g clip-path="url(#k0)"><rect class="sh" x="-90" y="156" width="90" height="8" fill="url(#sh)" style="animation-delay:-0.0s"/></g></g>
<g transform="translate(310 0)"><clipPath id="k1"><rect x="24" y="156" width="232" height="8" rx="4"/></clipPath>
<rect x="1" y="1" width="278" height="218" rx="10" fill="#0b0b0c" stroke="#d4af37" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="1" y="1" width="278" height="6" rx="3" fill="#d11"/>
<text class="c1" x="24" y="40">CONTRACT II</text>
<text class="c2" x="24" y="84">Master agent workflows</text><text class="c2" x="24" y="110">with LangGraph</text>
<circle class="dot" cx="30" cy="136" r="5" style="animation-delay:-0.5s"/><text class="c3" x="44" y="141">IN PROGRESS</text>
<rect x="24" y="156" width="232" height="8" rx="4" fill="#1b1b1d"/>
<g clip-path="url(#k1)"><rect class="sh" x="-90" y="156" width="90" height="8" fill="url(#sh)" style="animation-delay:-0.9s"/></g></g>
<g transform="translate(620 0)"><clipPath id="k2"><rect x="24" y="156" width="232" height="8" rx="4"/></clipPath>
<rect x="1" y="1" width="278" height="218" rx="10" fill="#0b0b0c" stroke="#d4af37" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="1" y="1" width="278" height="6" rx="3" fill="#d11"/>
<text class="c1" x="24" y="40">CONTRACT III</text>
<text class="c2" x="24" y="84">Ship projects &amp; contribute</text><text class="c2" x="24" y="110">to open source</text>
<circle class="dot" cx="30" cy="136" r="5" style="animation-delay:-1.0s"/><text class="c3" x="44" y="141">IN PROGRESS</text>
<rect x="24" y="156" width="232" height="8" rx="4" fill="#1b1b1d"/>
<g clip-path="url(#k2)"><rect class="sh" x="-90" y="156" width="90" height="8" fill="url(#sh)" style="animation-delay:-1.8s"/></g></g>

</svg>
