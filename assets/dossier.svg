<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Operative dossier for Yash Gaikwad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c7b22"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#9c7b22"/></linearGradient>
<pattern id="ln" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".05"/></pattern>
<style>
.bd{fill:#0a0a0b;stroke:#d4af37;stroke-width:2;stroke-dasharray:2400;animation:dr 3s ease-out both}
@keyframes dr{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
.ti{font-family:'Courier New',monospace;font-weight:700;font-size:16px;letter-spacing:5px;fill:url(#gold)}
.lb{font-family:'Courier New',monospace;font-size:14px;letter-spacing:3px;fill:#8d8d8d}
.vl{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:17px;letter-spacing:1px;fill:#f2f2f2}
.row{animation:ri .7s ease-out both}@keyframes ri{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.st{transform-box:fill-box;transform-origin:center;animation:sl .5s 2.8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes sl{from{opacity:0;transform:scale(2.4) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
.sp{animation:sp 2.4s 3.4s ease-in-out infinite}@keyframes sp{0%,100%{opacity:.7}50%{opacity:1}}
.stt{font-family:'Arial Black',Impact,sans-serif;font-size:26px;letter-spacing:4px;fill:#e11;text-anchor:middle}
.sc{animation:sc 4s linear infinite}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(330px)}}
</style></defs>
<rect class="bd" x="10" y="10" width="880" height="320" rx="10"/>
<rect x="10" y="10" width="880" height="320" rx="10" fill="url(#ln)"/>
<text class="ti" x="40" y="52">THE CONTINENTAL // OPERATIVE DOSSIER</text>
<line x1="40" y1="68" x2="860" y2="68" stroke="#d11" stroke-width="2"/>
<g class="row" style="animation-delay:0.9s"><text class="lb" x="40" y="112">NAME</text><text class="vl" x="280" y="112">YASH GAIKWAD</text><line x1="40" y1="124" x2="700" y2="124" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>
<g class="row" style="animation-delay:1.15s"><text class="lb" x="40" y="150">OCCUPATION</text><text class="vl" x="280" y="150">B.TECH STUDENT // CSR</text><line x1="40" y1="162" x2="700" y2="162" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>
<g class="row" style="animation-delay:1.4s"><text class="lb" x="40" y="188">HEADQUARTERS</text><text class="vl" x="280" y="188">MIT ADT UNIVERSITY</text><line x1="40" y1="200" x2="700" y2="200" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>
<g class="row" style="animation-delay:1.65s"><text class="lb" x="40" y="226">WEAPON OF CHOICE</text><text class="vl" x="280" y="226">PYTHON</text><line x1="40" y1="238" x2="700" y2="238" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>
<g class="row" style="animation-delay:1.9s"><text class="lb" x="40" y="264">CURRENT TARGETS</text><text class="vl" x="280" y="264">AGENTIC AI // LANGCHAIN // LANGGRAPH</text><line x1="40" y1="276" x2="700" y2="276" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>
<g class="row" style="animation-delay:2.15s"><text class="lb" x="40" y="302">CODE NAME</text><text class="vl" x="280" y="302">BABA YAGA OF BUGS</text><line x1="40" y1="314" x2="700" y2="314" stroke="#2a2a2a" stroke-dasharray="3 5"/></g>

<g class="st"><g class="sp">
<circle cx="790" cy="225" r="60" fill="none" stroke="#e11" stroke-width="4"/>
<circle cx="790" cy="225" r="52" fill="none" stroke="#e11" stroke-width="1.5" stroke-dasharray="3 5"/>
<text class="stt" x="790" y="235">ACTIVE</text>
</g></g>
<rect class="sc" x="12" y="0" width="876" height="3" fill="#ff2020" opacity=".18"/>
</svg>
