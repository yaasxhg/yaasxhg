<svg xmlns="http://www.w3.org/2000/svg" width="380" height="72" viewBox="0 0 380 72" role="img" aria-label="Connect on LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#9c7b22"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#9c7b22"/></linearGradient>
<style>
.run{fill:none;stroke:#ff2a2a;stroke-width:3;stroke-dasharray:140 860;animation:rn 3s linear infinite}@keyframes rn{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.s{font-family:'Courier New',monospace;font-size:12px;letter-spacing:4px;fill:#8d8d8d}
.b{font-family:'Arial Black',Impact,sans-serif;font-size:22px;letter-spacing:3px;fill:url(#gold)}
.in{font-family:'Arial Black',Impact,sans-serif;font-size:26px;fill:#1a1405;text-anchor:middle}
.ar{font-family:'Arial Black',sans-serif;font-size:30px;fill:#d11;animation:ar 1.2s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(8px);opacity:1}}
</style></defs>
<rect x="2" y="2" width="376" height="68" rx="12" fill="#0b0b0c" stroke="#d4af37" stroke-opacity=".35" stroke-width="2"/>
<rect class="run" x="2" y="2" width="376" height="68" rx="12" pathLength="1000"/>
<rect x="18" y="16" width="40" height="40" rx="8" fill="url(#gold)"/>
<text class="in" x="38" y="45">in</text>
<text class="s" x="76" y="32">CONNECT ON</text>
<text class="b" x="76" y="56">LINKEDIN</text>
<text class="ar" x="322" y="47">»</text>
</svg>
