<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="THE ARSENAL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c7b22"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#9c7b22"/></linearGradient><style>
.bar{transform-box:fill-box;transform-origin:center;animation:g 1s ease-out both}@keyframes g{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.h{font-family:'Arial Black','Segoe UI',Impact,sans-serif;font-weight:900;font-size:26px;letter-spacing:6px;fill:url(#gold);animation:s 1s .3s ease-out both}
@keyframes s{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.k{font-family:'Courier New',monospace;font-size:13px;letter-spacing:3px;fill:#8d8d8d;text-anchor:end;animation:s 1s .6s ease-out both}
.u{stroke:#d11;stroke-width:2;stroke-dasharray:900;animation:u 1.6s .4s ease-out both}@keyframes u{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.u2{stroke:#d4af37;stroke-width:2;stroke-dasharray:60 840;animation:run 4s linear infinite}@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-900}}
</style></defs>
<rect class="bar" x="0" y="12" width="6" height="36" fill="#d11"/>
<text class="h" x="22" y="40">THE ARSENAL</text>
<text class="k" x="896" y="40">TOOLS OF THE TRADE</text>
<line class="u" x1="0" y1="58" x2="900" y2="58"/>
<line class="u2" x1="0" y1="58" x2="900" y2="58"/>
</svg>
