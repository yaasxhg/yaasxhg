<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150" role="img" aria-label="Gold marker coin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5c12"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5c12"/></linearGradient>
<style>
.fl{transform-box:fill-box;transform-origin:center;animation:flip 3.2s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.06)}}
.bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sd{transform-box:fill-box;transform-origin:center;animation:sd 3.2s ease-in-out infinite}@keyframes sd{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.15;transform:scale(.8)}}
.t{font-family:'Arial Black',Impact,sans-serif;font-size:34px;fill:#4a3608;text-anchor:middle}
</style></defs>
<ellipse class="sd" cx="70" cy="138" rx="42" ry="6" fill="#000"/>
<g class="bob"><g class="fl">
<circle cx="70" cy="70" r="60" fill="url(#cg)" stroke="#7a5c12" stroke-width="4"/>
<circle cx="70" cy="70" r="49" fill="none" stroke="#7a5c12" stroke-width="2" stroke-dasharray="3 5"/>
<text class="t" x="70" y="82">YG</text>
</g></g>
</svg>
