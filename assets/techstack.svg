<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Tech stack: Python, LangChain, LangGraph, Agentic AI, Git, GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c7b22"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#9c7b22"/></linearGradient><style>
.fl{stroke:#b30000;stroke-opacity:.5;stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.tile{animation:ft 4s ease-in-out infinite}@keyframes ft{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.in{animation:pl 2.4s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.mo{font-family:'Arial Black',Impact,sans-serif;font-size:30px;fill:url(#gold);text-anchor:middle}
.nm{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;fill:#f2f2f2;text-anchor:middle}
.rl{font-family:'Courier New',monospace;font-size:11px;fill:#8d8d8d;text-anchor:middle}
</style></defs>
